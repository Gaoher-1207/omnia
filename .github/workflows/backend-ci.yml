name: OMNIA Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Run Python Code Checks & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: omnia_test_db
          POSTGRES_USER: omnia_user
          POSTGRES_PASSWORD: omnia_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Fawz/backend/requirements.txt ]; then pip install -r Fawz/backend/requirements.txt; fi

      - name: Check Django Syntax & Configuration
        env:
          SECRET_KEY: ci-testing-secret-key
          DEBUG: "True"
          POSTGRES_DB: omnia_test_db
          POSTGRES_USER: omnia_user
          POSTGRES_PASSWORD: omnia_password_123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          if [ -d Fawz/backend ]; then
            python Fawz/backend/manage.py check || true
          fi