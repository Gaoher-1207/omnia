# Backend stack for the Flutter app: PostgreSQL + API on http://localhost:8000/api
# 1. cp .env.example .env and fill in the values
# 2. docker compose up --build
# 3. optional demo data: docker compose exec backend python -m app.scripts.seed
# Then run the Flutter app (see README) pointing at http://localhost:8000/api.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnia
      POSTGRES_USER: omnia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnia -d omnia"]
      interval: 5s
      retries: 10
    # No published port: the database is only reachable from the backend.

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://omnia:${POSTGRES_PASSWORD}@db:5432/omnia
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      retries: 5

volumes:
  db-data:
