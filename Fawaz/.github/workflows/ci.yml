name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: omnia_test
          POSTGRES_USER: omnia
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnia" --health-interval 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg://omnia:ci-only-password@localhost:5432/omnia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: TEST_DATABASE_URL="$PG_URL" pytest
      - name: Migrations apply, match models, and roll back (PostgreSQL)
        run: |
          DATABASE_URL="$PG_URL" alembic upgrade head
          DATABASE_URL="$PG_URL" alembic check
          DATABASE_URL="$PG_URL" alembic downgrade base

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
