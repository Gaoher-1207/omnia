version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omnia_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnia_db}
      POSTGRES_USER: ${POSTGRES_USER:-omnia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnia_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ../../Fawz/backend
      dockerfile: Dockerfile
    container_name: omnia_django
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-local-development-key}
      - DEBUG=${DEBUG:-True}
      - POSTGRES_DB=${POSTGRES_DB:-omnia_db}
      - POSTGRES_USER=${POSTGRES_USER:-omnia_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-omnia_password_123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: